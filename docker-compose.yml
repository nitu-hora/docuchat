services:
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  app:
    build: .
    ports:
      - "7860:7860"
    depends_on:
      - ollama
    environment:
      OLLAMA_URL: http://ollama:11434/v1/
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      DB_PATH: /data/chroma_db
      HYBRID: ${HYBRID:-0}
      REWRITE: ${REWRITE:-0}
    volumes:
      - docuchat_data:/data

volumes:
  ollama_models:
  docuchat_data:
